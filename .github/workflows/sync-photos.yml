name: Sync photos from Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"
  push:
    paths:
      - "photos-manifest.json"
      - ".github/workflows/sync-photos.yml"

permissions:
  contents: write

concurrency:
  group: sync-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gdown
        run: pip install -q gdown

      - name: Download Drive files into photos/
        run: |
          python3 << 'PY'
          import json, subprocess, sys
          from pathlib import Path
          man = json.loads(Path("photos-manifest.json").read_text())
          out = Path("photos")
          out.mkdir(exist_ok=True)
          ok = 0
          folder = man.get("folder")
          if folder:
              tmp = Path("_drive_folder")
              tmp.mkdir(exist_ok=True)
              print("gdown folder", folder)
              r = subprocess.run(
                  ["gdown", "--folder", folder, "-O", str(tmp), "--remaining-ok"],
                  capture_output=True, text=True,
              )
              print(r.stdout)
              print(r.stderr)
              for p in tmp.rglob("*"):
                  if p.is_file() and p.suffix.lower() in {".jpg", ".jpeg", ".png", ".webp"}:
                      dest = out / p.name
                      dest.write_bytes(p.read_bytes())
                      print("copied folder file", dest, dest.stat().st_size)
                      ok += 1
          for f in man.get("files", []):
              dest = out / f["name"]
              if dest.exists() and dest.stat().st_size > 2000:
                  print("already have", dest.name, dest.stat().st_size)
                  continue
              print("gdown file", f["id"], "->", dest)
              r = subprocess.run(
                  ["gdown", "--id", f["id"], "-O", str(dest), "--fuzzy"],
                  capture_output=True, text=True,
              )
              print(r.stdout)
              print(r.stderr)
              if dest.exists() and dest.read_bytes()[:3] == b"\xff\xd8\xff":
                  print("ok", dest, dest.stat().st_size)
                  ok += 1
              else:
                  if dest.exists():
                      dest.unlink()
                  print("FAILED", f["name"])
          names = sorted(p.name for p in out.iterdir() if p.suffix.lower() in {".jpg", ".jpeg", ".png", ".webp"})
          Path("photos-list.js").write_text(
              "const REPO_PHOTOS = " + json.dumps(["photos/" + n for n in names], ensure_ascii=False) + ";\n"
          )
          print("result", names, "ok", ok)
          if not names:
              print("::error::Drive 文件夹没公开，Action 拉不到图。把文件夹设成「知道链接的任何人 / 查看」")
              sys.exit(1)
          PY

      - name: Commit photos if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos photos-list.js
          if git diff --cached --quiet; then
            echo "no photo changes"
          else
            git commit -m "sync photos from Drive"
            git pull --rebase origin main || true
            git push
          fi
