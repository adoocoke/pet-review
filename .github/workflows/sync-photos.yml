name: Sync photos from Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"
  push:
    paths:
      - "photos-manifest.json"
      - ".github/workflows/sync-photos.yml"

permissions:
  contents: write

concurrency:
  group: sync-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Drive files into photos/
        run: |
          python3 << 'PY'
          import json, urllib.request
          from pathlib import Path
          man = json.loads(Path("photos-manifest.json").read_text())
          out = Path("photos")
          out.mkdir(exist_ok=True)
          ok = 0
          for f in man.get("files", []):
              dest = out / f["name"]
              urls = [
                  "https://drive.google.com/uc?export=download&id=" + f["id"],
                  "https://drive.usercontent.google.com/download?id=" + f["id"] + "&export=download",
              ]
              print("GET", f["name"], f["id"])
              saved = False
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 pet-review-sync"})
                      with urllib.request.urlopen(req, timeout=90) as r:
                          data = r.read()
                      print(" ", url[:60], "bytes", len(data), "type", r.headers.get("content-type"))
                      if len(data) >= 2000 and data[:3] == b"\xff\xd8\xff":
                          dest.write_bytes(data)
                          print(" wrote", dest, dest.stat().st_size)
                          ok += 1
                          saved = True
                          break
                  except Exception as e:
                      print(" fail", url[:60], e)
              if not saved:
                  print(" MISSING", f["name"])
          names = sorted(p.name for p in out.iterdir() if p.suffix.lower() in {".jpg", ".jpeg", ".png", ".webp"})
          Path("photos-list.js").write_text(
              "const REPO_PHOTOS = " + json.dumps(["photos/" + n for n in names], ensure_ascii=False) + ";\n"
          )
          print("result", names, "ok", ok)
          if not names:
              raise SystemExit("no photos downloaded")
          PY

      - name: Commit photos if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos photos-list.js
          if git diff --cached --quiet; then
            echo "no photo changes"
          else
            git commit -m "sync photos from Drive"
            git pull --rebase origin main || true
            git push
          fi
