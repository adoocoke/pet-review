<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KET/PET 错题 Review</title>
<style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#1f2933;--muted:#5b6773;--line:#e4ddd2;--red:#c0392b;--green:#1f7a4d;--gold:#c9842a;--soft-red:#fdecea;--soft-green:#e8f6ee;--soft-blue:#eaf2fb}
*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Noto Sans SC",sans-serif;background:#f4f1ea;color:#1f2933;line-height:1.55}
header,main{max-width:860px;margin:0 auto}header{padding:20px 20px 8px}
.kicker{margin:0;letter-spacing:.12em;font-size:12px;color:var(--gold);font-weight:700}h1{margin:6px 0 4px;font-size:24px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}h1 .ver{font-size:13px;font-weight:500;color:var(--muted)}
.sub{margin:0;color:var(--muted);font-size:14px}main{padding:12px 16px 56px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}
.tabs button.active{background:var(--ink);color:#fff}
.panel{display:none}.panel.active{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.item{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.item h3{margin:4px 0 2px;font-size:16px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft-red);color:var(--red)}
.badge.ok{background:var(--soft-green);color:var(--green)}
.q-en{font-size:18px;font-weight:650;margin:10px 0}
.blank{display:inline-block;min-width:72px;border-bottom:2px solid var(--gold);text-align:center;color:var(--gold);font-weight:800}
.choices{display:grid;gap:8px;margin:12px 0}
.choices button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.choices button.correct{background:var(--soft-green)}.choices button.wrong{background:var(--soft-red)}
.explain{background:var(--soft-blue);border-radius:12px;padding:12px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.primary{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
button.ghost{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.flip{min-height:130px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.flip .en{font-size:28px;font-weight:800}.flip .cn{font-size:20px}.flip .hint{color:var(--muted);font-size:13px;margin-top:8px}
img.page{width:100%;border-radius:12px;border:1px solid var(--line)}
.note-body p{margin:0 0 10px}.due{background:#fff4e5}
.history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
</style></head>
<body>
<header><p class="kicker">KET / PET REVIEW</p><h1>产生错误的题目 <span class="ver">v0.4.1</span></h1><p class="sub">按题目 · 按知识点 · Drive 原图</p></header>
<main>
<div class="tabs" id="mainTabs">
<button class="active" data-tab="list">今日复习</button>
<button data-tab="byQ">按题目</button>
<button data-tab="byTag">按知识点</button>
<button data-tab="cards">单词词组卡</button>
<button data-tab="history">学习历史</button>
</div>
<section id="list" class="panel active"></section>
<section id="byQ" class="panel"></section>
<section id="byTag" class="panel"></section>
<section id="detail" class="panel"></section>
<section id="cards" class="panel"></section>
<section id="history" class="panel">
<div class="stats"><div class="stat"><b id="statTried">0</b><span>练习次数</span></div><div class="stat"><b id="statRight">0</b><span>做对</span></div><div class="stat"><b id="statNeed">0</b><span>今日到期</span></div></div>
<div class="card" id="historyList"><p class="sub">还没有记录。</p></div>
</section></main>
<script src="data.js"></script>
<script src="group.js"></script>
<script src="photos-drive.js"></script>
<script src="srs.js"></script>
<script>
const KEY="pet-review-v4";
const old3=JSON.parse(localStorage.getItem("pet-review-v3")||"null");
const state=JSON.parse(localStorage.getItem(KEY)||"null")||old3||{tries:[],need:{},srs:{}};
if(!state.srs)state.srs={};
ITEMS.forEach(it=>{if(state.need[it.id]===undefined)state.need[it.id]=true;srsInit(it.id,state)});
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderList();renderByQ();renderByTag();renderHistory()}
function photoSrc(path){return (window.DRIVE_PHOTOS&&DRIVE_PHOTOS[path])||(window.PHOTO&&PHOTO[path])||path}
document.querySelectorAll("#mainTabs button").forEach(btn=>btn.addEventListener("click",()=>{
document.querySelectorAll("#mainTabs button").forEach(b=>b.classList.remove("active"));
document.querySelectorAll("main > .panel").forEach(p=>p.classList.remove("active"));
btn.classList.add("active");document.getElementById(btn.dataset.tab).classList.add("active")}));
function renderList(){const box=document.getElementById("list");
const due=ITEMS.filter(it=>srsDue(state.srs[it.id]));
const later=ITEMS.filter(it=>!srsDue(state.srs[it.id]));later.sort((a,b)=>state.srs[a.id].next-state.srs[b.id].next);
const intro=`<div class="card"><p>今天到期 <b>${due.length}</b> 题。</p></div>`;
const row=(it,isDue)=>`<div class="card item ${isDue?"due":""}" data-id="${it.id}"><div><span class="badge ${isDue?"":"ok"}">${isDue?"今日到期":srsWhen(state.srs[it.id])}</span><h3>${it.title}</h3><p class="sub">${it.tag} · ${it.point||""}</p></div><button class="ghost">开始</button></div>`;
box.innerHTML=intro+due.map(it=>row(it,true)).join("")+later.map(it=>row(it,false)).join("");
box.querySelectorAll(".item").forEach(el=>el.addEventListener("click",()=>openDetail(el.dataset.id,"quiz")))}
function itemRow(it){const rec=state.srs[it.id]||{streak:0};const due=srsDue(rec);
return `<div class="card item ${due?"due":""}" data-id="${it.id}"><div><span class="badge ${due?"":"ok"}">${it.tag}</span><h3>${it.title}</h3><p class="sub">${it.point||""}</p></div><button class="ghost">开始</button></div>`}
function renderByQ(){const box=document.getElementById("byQ");const map=itemsByPassage();
box.innerHTML="<div class=\"card\"><p>按<b>原题</b>归堆。</p></div>"+Object.keys(map).map(name=>{const list=map[name];return `<div class="card"><h3 style="margin:0 0 8px">${name}</h3><p class="sub">${list.length} 道</p></div>`+list.map(itemRow).join("")}).join("");
box.querySelectorAll(".item").forEach(el=>el.addEventListener("click",()=>openDetail(el.dataset.id,"quiz")))}
function renderByTag(){const box=document.getElementById("byTag");const map=itemsByTag();
box.innerHTML="<div class=\"card\"><p>按<b>知识点</b>归堆。</p></div>"+TAG_ORDER.map(tag=>{const list=map[tag]||[];if(!list.length)return"";return `<div class="card"><h3 style="margin:0 0 6px">${tag}</h3><p class="sub">${list.length} 题</p></div>`+list.map(itemRow).join("")}).join("");
box.querySelectorAll(".item").forEach(el=>el.addEventListener("click",()=>openDetail(el.dataset.id,"quiz")))}
function openDetail(id,tab){const it=ITEMS.find(x=>x.id===id);const el=document.getElementById("detail");
el.innerHTML=`<div class="row"><button class="ghost" id="backList">← 返回</button></div>
<div class="tabs" id="subTabs">
<button data-sub="quiz" class="${tab==="quiz"?"active":""}">再做一次</button>
<button data-sub="note" class="${tab==="note"?"active":""}">错因笔记</button>
<button data-sub="photo" class="${tab==="photo"?"active":""}">看原题照片</button></div>
<div id="sub-quiz" class="panel ${tab==="quiz"?"active":""}"><div class="card"><span class="badge">${it.tag}</span><p class="sub">${it.passage} · ${it.point||""}</p><div class="q-en">${it.prompt}</div><div class="choices" id="choices"></div><div id="result" class="explain" hidden></div><div class="row"><button class="ghost" id="retry">再练一遍</button><button class="primary" id="markAgain">这题还要复习</button></div></div></div>
<div id="sub-note" class="panel ${tab==="note"?"active":""}"><div class="card"><span class="badge">${it.tag}</span><h3>${it.title}</h3><div class="note-body">${it.note}</div></div></div>
<div id="sub-photo" class="panel ${tab==="photo"?"active":""}"><div class="card"><p>${it.passage}</p><img class="page" src="${photoSrc(it.photo)}" alt="${it.title}"></div></div>`;
document.querySelectorAll("#mainTabs button").forEach(b=>b.classList.remove("active"));
document.querySelectorAll("main > .panel").forEach(p=>p.classList.remove("active"));el.classList.add("active");
document.getElementById("backList").onclick=()=>document.querySelector('#mainTabs button[data-tab="list"]').click();
el.querySelectorAll("#subTabs button").forEach(b=>b.onclick=()=>{el.querySelectorAll("#subTabs button").forEach(x=>x.classList.remove("active"));el.querySelectorAll("#sub-quiz,#sub-note,#sub-photo").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("sub-"+b.dataset.sub).classList.add("active")});
const choices=document.getElementById("choices");
it.options.forEach(op=>{const b=document.createElement("button");b.dataset.key=op.key;b.textContent=op.text;
b.onclick=()=>{if(choices.dataset.locked==="1")return;choices.dataset.locked="1";const ok=op.key===it.answer;
b.classList.add(ok?"correct":"wrong");choices.querySelector('[data-key="'+it.answer+'"]').classList.add("correct");
const blank=el.querySelector(".blank");if(blank)blank.textContent=it.fill;
const rec=srsMark(srsInit(it.id,state),ok);state.need[it.id]=!ok;
const result=document.getElementById("result");result.hidden=false;
result.innerHTML=(ok?"<strong>对了。</strong> ":"<strong>这题容易错。</strong> ")+(ok?it.ok:it.bad)+"<p>下次：<b>"+SRS_STEPS[rec.step].label+"</b></p>";
state.tries.push({at:new Date().toISOString(),id:it.id,ok});save()};choices.appendChild(b)});
document.getElementById("retry").onclick=()=>openDetail(id,"quiz");
document.getElementById("markAgain").onclick=()=>{srsMark(srsInit(it.id,state),false);state.need[it.id]=true;save()}}
function renderCards(){const box=document.getElementById("cards");box.innerHTML=CARDS.map(c=>`<div class="card flip" data-front="${c[0]}" data-back="${c[1]}" data-hint="${c[2]}"></div>`).join("");
box.querySelectorAll(".flip").forEach(card=>{card.innerHTML=`<div class="front"><div class="cn">${card.dataset.front}</div><div class="hint">点击看英文</div></div><div class="back" hidden><div class="en">${card.dataset.back}</div><div class="hint">${card.dataset.hint}</div></div>`;
card.onclick=()=>{const f=card.querySelector(".front"),b=card.querySelector(".back"),show=b.hidden;f.hidden=show;b.hidden=!show}})}
function renderHistory(){document.getElementById("statTried").textContent=state.tries.length;document.getElementById("statRight").textContent=state.tries.filter(t=>t.ok).length;document.getElementById("statNeed").textContent=ITEMS.filter(it=>srsDue(state.srs[it.id])).length;
const box=document.getElementById("historyList");if(!state.tries.length)return;
const names=Object.fromEntries(ITEMS.map(it=>[it.id,it.title]));
box.innerHTML=state.tries.slice().reverse().slice(0,40).map(t=>{const time=new Date(t.at).toLocaleString("zh-CN",{hour12:false});return `<div class="history-item"><span>${time}</span><span>${t.note||((t.ok?"做对 ":"未掌握 ")+(names[t.id]||""))}</span></div>`}).join("")}
renderList();renderByQ();renderByTag();renderCards();renderHistory();
</script></body></html>
