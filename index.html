<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KET/PET 错题 Review</title>
<style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#1f2933;--muted:#5b6773;--line:#e4ddd2;--red:#c0392b;--green:#1f7a4d;--gold:#c9842a;--soft-red:#fdecea;--soft-green:#e8f6ee;--soft-blue:#eaf2fb}
*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Noto Sans SC",sans-serif;background:#f4f1ea;color:#1f2933;line-height:1.55}
header,main{max-width:860px;margin:0 auto}header{padding:20px 20px 8px}
.kicker{margin:0;letter-spacing:.12em;font-size:12px;color:var(--gold);font-weight:700}h1{margin:6px 0 4px;font-size:24px}
.sub{margin:0;color:var(--muted);font-size:14px}main{padding:12px 16px 56px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}
.tabs button.active{background:var(--ink);color:#fff}
.panel{display:none}.panel.active{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.item{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.item h3{margin:0 0 4px;font-size:17px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft-red);color:var(--red)}
.badge.ok{background:var(--soft-green);color:var(--green)}
.q-en{font-size:18px;font-weight:650;margin:10px 0}
.blank{display:inline-block;min-width:72px;border-bottom:2px solid var(--gold);text-align:center;color:var(--gold);font-weight:800}
.choices{display:grid;gap:8px;margin:12px 0}
.choices button,.row button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.choices button.correct{background:var(--soft-green)}.choices button.wrong{background:var(--soft-red)}
.explain{background:var(--soft-blue);border-radius:12px;padding:12px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.primary{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
button.ghost{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.flip{min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.flip .en{font-size:30px;font-weight:800}.flip .cn{font-size:20px}.flip .hint{color:var(--muted);font-size:13px;margin-top:8px}
.history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header><p class="kicker">KET / PET REVIEW</p><h1>产生错误的题目</h1><p class="sub">纸质练习入库复习</p></header>
<main>
<div class="tabs" id="mainTabs">
<button class="active" data-tab="list">错题本</button>
<button data-tab="cards">词组卡</button>
<button data-tab="history">学习历史</button>
</div>
<section id="list" class="panel active"></section>
<section id="quiz" class="panel"></section>
<section id="cards" class="panel">
<div class="card flip" data-front="受……欢迎" data-back="popular with" data-hint="popular with people"></div>
<div class="card flip" data-front="比（比较级后面）" data-back="than" data-hint="bigger than · 不是 then / of"></div>
<div class="card flip" data-front="礼物来自某人" data-back="from" data-hint="presents from my parents"></div>
<div class="card flip" data-front="在顶部" data-back="on the top" data-hint="a picture on the top"></div>
<div class="card flip" data-front="放学后" data-back="after school" data-hint="free after school"></div>
</section>
<section id="history" class="panel">
<div class="stats"><div class="stat"><b id="statTried">0</b><span>练习次数</span></div><div class="stat"><b id="statRight">0</b><span>做对</span></div><div class="stat"><b id="statNeed">0</b><span>仍需复习</span></div></div>
<div class="card" id="historyList"><p class="sub">还没有记录。</p></div>
</section>
</main>
<script>
const KEY="pet-review-v2";
const ITEMS=[
{id:"ket-p135-q23",title:"Central Park 第 23 题",meta:"KET Part 4 · p.135",prompt:'The park is also very <span class="blank">23</span> with people who like sport.',options:[{key:"A",text:"beautiful"},{key:"B",text:"popular"},{key:"C",text:"big"}],answer:"B",fill:"popular",ok:"popular with people = 受欢迎。",bad:"空格后是 with people，用 popular with。",note:"be popular with somebody"},
{id:"ket-part5-q27",title:"邮件第 27 题 from",meta:"KET Part 5",prompt:'I got some good presents <span class="blank">27</span> my parents too.',options:[{key:"with",text:"with"},{key:"from",text:"from"},{key:"by",text:"by"}],answer:"from",fill:"from",ok:"presents from my parents。",bad:"礼物来源用 from，不是 with。",note:"东西是谁给的 → from"},
{id:"ket-part5-q28",title:"邮件第 28 题 than",meta:"KET Part 5 · 最容易混",prompt:'It\'s bigger <span class="blank">28</span> my old one.',options:[{key:"of",text:"of"},{key:"then",text:"then"},{key:"than",text:"than"}],answer:"than",fill:"than",ok:"bigger than = 比……更大。",bad:"than 才是「比」。then 是然后，of 不对。",note:"比较级后面用 than，不是 then"},
{id:"ket-part5-q29",title:"邮件第 29 题 on",meta:"KET Part 5",prompt:'a really cool picture <span class="blank">29</span> the top.',options:[{key:"in",text:"in"},{key:"on",text:"on"},{key:"at",text:"at"}],answer:"on",fill:"on",ok:"on the top。",bad:"在顶部用 on，不是 in。",note:"on the top"}
];
const state=JSON.parse(localStorage.getItem(KEY)||'{"tries":[],"need":{}}');
ITEMS.forEach(it=>{if(state.need[it.id]===undefined)state.need[it.id]=true});
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderList();renderHistory()}
document.querySelectorAll("#mainTabs button").forEach(btn=>btn.addEventListener("click",()=>{
document.querySelectorAll("#mainTabs button").forEach(b=>b.classList.remove("active"));
document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
btn.classList.add("active");document.getElementById(btn.dataset.tab).classList.add("active")}));
function renderList(){const box=document.getElementById("list");box.innerHTML=ITEMS.map(it=>`<div class="card item" data-id="${it.id}"><div><span class="badge ${state.need[it.id]?"":"ok"}">${state.need[it.id]?"仍需复习":"已掌握"}</span><h3>${it.title}</h3><p class="sub">${it.meta}</p></div><button class="ghost">开始</button></div>`).join("");
box.querySelectorAll(".item").forEach(el=>el.addEventListener("click",()=>openQuiz(el.dataset.id)))}
function openQuiz(id){const it=ITEMS.find(x=>x.id===id);const quiz=document.getElementById("quiz");
quiz.innerHTML=`<div class="backlink"><button class="ghost" id="backList">← 错题本</button></div><div class="card"><span class="badge">错题</span><div class="q-en">${it.prompt}</div><div class="choices" id="choices"></div><div id="result" class="explain" hidden></div><p class="sub">${it.note}</p><div class="row"><button class="ghost" id="retry">再练一遍</button><button class="primary" id="markAgain">这题还要复习</button></div></div>`;
document.querySelectorAll("#mainTabs button").forEach(b=>b.classList.remove("active"));
document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));quiz.classList.add("active");
document.getElementById("backList").onclick=()=>document.querySelector('#mainTabs button[data-tab="list"]').click();
const choices=document.getElementById("choices");
it.options.forEach(op=>{const b=document.createElement("button");b.dataset.key=op.key;b.textContent=op.text;
b.onclick=()=>{if(choices.dataset.locked==="1")return;choices.dataset.locked="1";const ok=op.key===it.answer;
b.classList.add(ok?"correct":"wrong");choices.querySelector('[data-key="'+it.answer+'"]').classList.add("correct");
const blank=quiz.querySelector(".blank");if(blank)blank.textContent=it.fill;
const result=document.getElementById("result");result.hidden=false;result.innerHTML=(ok?"<strong>对了。</strong> ":"<strong>这题容易错。</strong> ")+(ok?it.ok:it.bad);
state.tries.push({at:new Date().toISOString(),id:it.id,ok});if(ok)state.need[it.id]=false;save()};choices.appendChild(b)});
document.getElementById("retry").onclick=()=>openQuiz(id);
document.getElementById("markAgain").onclick=()=>{state.need[it.id]=true;state.tries.push({at:new Date().toISOString(),id:it.id,ok:false,note:"手动标记"});save()}}
document.querySelectorAll(".flip").forEach(card=>{card.innerHTML=`<div class="front"><div class="cn">${card.dataset.front}</div><div class="hint">点击看英文</div></div><div class="back" hidden><div class="en">${card.dataset.back}</div><div class="hint">${card.dataset.hint||""}</div></div>`;
card.onclick=()=>{const f=card.querySelector(".front"),b=card.querySelector(".back"),show=b.hidden;f.hidden=show;b.hidden=!show}});
function renderHistory(){const tried=state.tries.length,right=state.tries.filter(t=>t.ok).length,need=ITEMS.filter(it=>state.need[it.id]).length;
document.getElementById("statTried").textContent=tried;document.getElementById("statRight").textContent=right;document.getElementById("statNeed").textContent=need;
const box=document.getElementById("historyList");if(!state.tries.length)return;
const names=Object.fromEntries(ITEMS.map(it=>[it.id,it.title]));
box.innerHTML=state.tries.slice().reverse().slice(0,30).map(t=>{const time=new Date(t.at).toLocaleString("zh-CN",{hour12:false});const text=t.note||((t.ok?"做对 ":"未掌握 ")+(names[t.id]||t.id));return `<div class="history-item"><span>${time}</span><span>${text}</span></div>`}).join("")}
renderList();renderHistory();
</script>
</body></html>
